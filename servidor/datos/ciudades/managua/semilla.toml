# Datos sintéticos de demostración para Managua.
# En el paso 6 los scripts de preparación/ reemplazan la población y la vulnerabilidad
# sintéticas por datos reales (OSM, censo). Para otra ciudad, copiar y ajustar este archivo.

semilla_aleatoria = 2026

[poblacion]
# Personas por celda h3 (resolución 8, ~0,74 km²) de noche en el centro del área
noche_max = 4500.0
# Cuánto cae la población del centro al borde (0 = uniforme, 1 = vacía en el borde)
caida_al_borde = 0.6
variacion = 0.3
# Factor de ocupación de día (8 a 18 h) respecto de la noche, por tipo de zona
factor_dia = { residencial = 0.6, comercial = 1.8, mixta = 1.0 }
factor_noche = { residencial = 1.0, comercial = 0.3, mixta = 0.9 }
hora_inicio_dia = 8
hora_fin_dia = 18

[zonas]
# Fracción del radio considerada centro (más comercio y construcción antigua)
radio_centro = 0.3
probabilidad_comercial_centro = 0.6
probabilidad_mixta = 0.25

# Mezcla de construcción por tipo de zona (se normaliza y varía por celda)
[zonas.construccion.residencial]
precaria = 0.15
adobe_taquezal = 0.15
mamposteria_no_reforzada = 0.2
mamposteria_confinada = 0.4
concreto_reforzado = 0.1

[zonas.construccion.comercial]
adobe_taquezal = 0.25
mamposteria_no_reforzada = 0.2
mamposteria_confinada = 0.25
concreto_reforzado = 0.3

[zonas.construccion.mixta]
precaria = 0.05
adobe_taquezal = 0.2
mamposteria_no_reforzada = 0.25
mamposteria_confinada = 0.35
concreto_reforzado = 0.15

[zonas.vulnerabilidad]
residencial = [0.3, 0.8]
comercial = [0.2, 0.5]
mixta = [0.25, 0.65]

[infraestructura]
# Probabilidad de que una celda tenga cada tipo de infraestructura crítica
hospital = 0.04
escuela = 0.2
albergue = 0.06

